name: Build Universal Unlock DEX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Download smali tools
      run: |
        mkdir -p tools
        cd tools
        curl -L -o smali.jar https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar
        curl -L -o baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar
        ls -la
        file smali.jar
    
    - name: Build DEX
      run: |
        java -jar tools/smali.jar assemble smali/ -o universal_unlock.dex
        ls -la universal_unlock.dex
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: universal-unlock-dex
        path: universal_unlock.dex
        retention-days: 90
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Universal Unlock DEX v1.0.${{ github.run_number }}
        files: universal_unlock.dex
        body: |
          ## Universal Unlock DEX
          **Key:** `12947-ffmax`
          **Days:** Unlimited
          **Time:** Unlimited
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
