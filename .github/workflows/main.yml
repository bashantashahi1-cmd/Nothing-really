name: Build Universal Unlock DEX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Download smali
      run: |
        mkdir -p tools
        curl -L -o tools/smali.jar https://github.com/google/smali/releases/download/v3.0.5/smali-3.0.5-fat.jar
        curl -L -o tools/baksmali.jar https://github.com/google/smali/releases/download/v3.0.5/baksmali-3.0.5-fat.jar
    
    - name: Build DEX
      run: |
        java -jar tools/smali.jar assemble smali/ -o universal_unlock.dex
        ls -la universal_unlock.dex
    
    - name: Verify DEX
      run: |
        java -jar tools/baksmali.jar disassemble universal_unlock.dex -o verify/
        echo "DEX verified"
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: universal-unlock-dex
        path: universal_unlock.dex
        retention-days: 90
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Universal Unlock DEX v1.0.${{ github.run_number }}
        files: universal_unlock.dex
        body: |
          ## Universal Unlock DEX
          
          **Key:** `12947-ffmax`
          **Days:** Unlimited
          **Time:** Unlimited
          
          ### Apply via MT Manager
          1. Open target APK
          2. Inject dex
          3. Sign & install
          4. Enter key
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}